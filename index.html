<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 저녁 뭐 먹지?</title>

<style>
    body {
        text-align: center;
        background: #fff4df;
        font-family: sans-serif;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        transition: background 0.5s, color 0.5s;
    }

    h1 {
        margin-top: 50px;
        color: #ff6b35;
    }

    p {
        font-size: 18px;
    }

    .card {
        width: 280px;
        height: 380px;
        margin: 40px auto;
        cursor: pointer;
        perspective: 1000px;
        transition: transform 0.3s;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    .card.open .card-inner {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        backface-visibility: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        box-sizing: border-box;
        padding: 25px;
    }

    .front {
        background: linear-gradient(135deg, #ff6b6b, #ff9f43);
        color: white;
        font-size: 32px;
        font-weight: bold;
    }

    .front span {
        font-size: 70px;
        margin-bottom: 20px;
        animation: bounce 1.5s infinite;
    }

    .back {
        background: white;
        color: #333;
        transform: rotateY(180deg);
    }

    .back .emoji {
        font-size: 80px;
        margin-bottom: 20px;
    }

    .back .menu {
        font-size: 30px;
        font-weight: bold;
        color: #ff6b35;
    }

    .back .comment {
        margin-top: 15px;
        font-size: 16px;
        color: #777;
    }

    .hint {
        color: #888;
        font-size: 14px;
    }

    /* 카드 앞면 통통 효과 */
    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    /* 뽑기 직전 두근두근 */
    .heartbeat {
        animation: heartbeat 0.18s infinite alternate;
    }

    @keyframes heartbeat {
        from {
            transform: scale(1);
        }
        to {
            transform: scale(1.08);
        }
    }

    /* 굶기 / 다시뽑기용 흔들림 */
    .shake {
        animation: shake 0.5s;
    }

    @keyframes shake {
        0%, 100% {
            transform: translateX(0);
        }
        20% {
            transform: translateX(-15px) rotate(-3deg);
        }
        40% {
            transform: translateX(15px) rotate(3deg);
        }
        60% {
            transform: translateX(-10px) rotate(-2deg);
        }
        80% {
            transform: translateX(10px) rotate(2deg);
        }
    }

    /* 다시뽑기 빙글 효과 */
    .spin {
        animation: spin 0.8s;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg) scale(1);
        }
        50% {
            transform: rotate(180deg) scale(0.7);
        }
        100% {
            transform: rotate(360deg) scale(1);
        }
    }

    /* 굶기 화면 */
    body.hungry {
        background: #171717;
    }

    body.hungry h1 {
        color: #eeeeee;
    }

    body.hungry p {
        color: #eeeeee;
    }

    body.hungry .card {
        animation: shake 0.5s;
    }

    /* 🎉 파티클 */
    .particle {
        position: fixed;
        top: -40px;
        pointer-events: none;
        font-size: 25px;
        z-index: 100;
        animation: fall linear forwards;
    }

    @keyframes fall {
        from {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }

        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    /* 결과 공개 순간 살짝 확대 */
    .result-pop {
        animation: resultPop 0.5s;
    }

    @keyframes resultPop {
        0% {
            transform: scale(0.5);
        }
        70% {
            transform: scale(1.1);
        }
        100% {
            transform: scale(1);
        }
    }

</style>
</head>

<body>

<h1>🍽️ 오늘 저녁 뭐 먹지? feat.801호</h1>

<p>고민하지 말고 카드를 뽑아보시오</p>

<div class="card" onclick="drawMenu()" id="card">

    <div class="card-inner">

        <!-- 카드 앞면 -->
        <div class="front">
            <span>🎴</span>
            오늘의<br>저녁 메뉴
        </div>

        <!-- 카드 뒷면 -->
        <div class="back">

            <div class="emoji" id="emoji">🍚</div>

            <div class="menu" id="menu">
                메뉴
            </div>

            <div class="comment" id="comment">
                오늘은 이거다!
            </div>

        </div>

    </div>

</div>

<p class="hint">👆 카드를 누르거라~ 다시 누르면 리셋~</p>


<script>

const menus = [

    {
        name: "치킨",
        emoji: "🍗",
        comment: "마트치킨/보드람/잉치킨",
        type: "food"
    },

    {
        name: "피자",
        emoji: "🍕",
        comment: "오지고지리는피자",
        type: "food"
    },

    {
        name: "삼겹살",
        emoji: "🥓",
        comment: "소,돼지 다 가능",
        type: "food"
    },

    {
        name: "떡볶이",
        emoji: "🌶️",
        comment: "분식류",
        type: "food"
    },

    {
        name: "초밥",
        emoji: "🍣",
        comment: "당산 회전초밥",
        type: "food"
    },

    {
        name: "햄버거",
        emoji: "🍔",
        comment: "롯데리아 얼마전에 먹긴함",
        type: "food"
    },

    {
        name: "족발",
        emoji: "🍖",
        comment: "배달시켜야겠지?",
        type: "food"
    },

    {
        name: "곱창or막창",
        emoji: "🥓",
        comment: "생곱창or대구막창",
        type: "food"
    },

    {
        name: "쭈꾸미&닭발",
        emoji: "🌶️",
        comment: "혓바닥,구내염나긴함",
        type: "food"
    },

    {
        name: "다시뽑기",
        emoji: "🔄",
        comment: "의견을 주어도 좋음",
        type: "retry"
    },

    {
        name: "굶기",
        emoji: "💀",
        comment: "오늘은 그냥 굶는 것으로...",
        type: "hungry"
    }

];


let isOpen = false;
let busy = false;


function drawMenu() {

    if (busy) return;

    const card = document.getElementById("card");

    // 처음 뽑기
    if (!isOpen) {

        busy = true;

        // 카드 두근두근
        card.classList.add("heartbeat");

        setTimeout(() => {

            card.classList.remove("heartbeat");

            showRandomMenu();

            card.classList.add("open");

            isOpen = true;
            busy = false;

        }, 800);

    }

    // 이미 결과가 나온 상태
    else {

        busy = true;

        // 카드 닫기
        card.classList.remove("open");

        setTimeout(() => {

            showRandomMenu();

            card.classList.add("open");

            isOpen = true;
            busy = false;

        }, 500);
    }
}


function showRandomMenu() {

    const randomIndex =
        Math.floor(Math.random() * menus.length);

    const selected = menus[randomIndex];

    const emoji =
        document.getElementById("emoji");

    const menu =
        document.getElementById("menu");

    const comment =
        document.getElementById("comment");

    const card =
        document.getElementById("card");


    emoji.innerText = selected.emoji;
    menu.innerText = selected.name;
    comment.innerText = selected.comment;


    // 결과 등장 효과
    emoji.classList.remove("result-pop");

    void emoji.offsetWidth;

    emoji.classList.add("result-pop");


    // 특별 효과 초기화
    document.body.classList.remove("hungry");

    card.classList.remove("shake");
    card.classList.remove("spin");


    /* 🍗 음식 메뉴 */
    if (selected.type === "food") {

        partyEffect();

    }


    /* 🔄 다시 뽑기 */
    if (selected.type === "retry") {

        setTimeout(() => {

            card.classList.add("spin");

            setTimeout(() => {
                card.classList.remove("spin");
            }, 800);

        }, 100);

    }


    /* 💀 굶기 */
    if (selected.type === "hungry") {

        setTimeout(() => {

            document.body.classList.add("hungry");

            card.classList.add("shake");

        }, 200);

    }

}


/* 🎉 음식 메뉴 파티클 */

function partyEffect() {

    const emojis = [
        "🎉",
        "✨",
        "🎊",
        "❤️",
        "🍗",
        "🍕",
        "🍣",
        "🍔"
    ];

    for (let i = 0; i < 35; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        particle.innerText =
            emojis[
                Math.floor(Math.random() * emojis.length)
            ];

        particle.style.left =
            Math.random() * 100 + "vw";

        particle.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(particle);


        setTimeout(() => {

            particle.remove();

        }, 4000);

    }

}

</script>

</body>
</html>
