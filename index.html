<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 저녁 뭐 먹지?</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        text-align: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fff3d6, #ffe0b2);
        overflow: hidden;
        transition: 0.4s;
    }

    h1 {
        margin-top: 50px;
        color: #ff6333;
        font-size: 32px;
    }

    .subtitle {
        color: #777;
        font-size: 17px;
    }

    /* 카드 */
    .card {
        width: 280px;
        height: 380px;
        margin: 40px auto 25px;
        cursor: pointer;
        perspective: 1200px;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.7s;
        transform-style: preserve-3d;
    }

    .card.open .card-inner {
        transform: rotateY(180deg);
    }

    .front,
    .back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    /* 앞면 */
    .front {
        background: linear-gradient(135deg, #ff4d6d, #ff9f43);
        color: white;
        font-size: 30px;
        font-weight: bold;
    }

    .front .big {
        font-size: 85px;
        margin-bottom: 20px;
        animation: bounce 1.5s infinite;
    }

    /* 뒷면 */
    .back {
        background: white;
        color: #333;
        transform: rotateY(180deg);
        padding: 25px;
    }

    .emoji {
        font-size: 85px;
        margin-bottom: 20px;
    }

    .menu {
        font-size: 32px;
        font-weight: bold;
        color: #ff6333;
    }

    .comment {
        margin-top: 18px;
        font-size: 16px;
        color: #777;
        line-height: 1.5;
    }

    .hint {
        color: #888;
        font-size: 14px;
    }

    /* 앞면 살짝 통통 */
    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-10px);
        }
    }

    /* 두근두근 */
    .heartbeat {
        animation: heartbeat 0.25s infinite alternate;
    }

    @keyframes heartbeat {
        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.08);
        }
    }

    /* 카드 흔들기 */
    .shake {
        animation: shake 0.5s;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-15px) rotate(-3deg); }
        40% { transform: translateX(15px) rotate(3deg); }
        60% { transform: translateX(-10px) rotate(-2deg); }
        80% { transform: translateX(10px) rotate(2deg); }
    }

    /* 다시 뽑기 */
    .spin {
        animation: spin 0.8s;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg) scale(1);
        }

        50% {
            transform: rotate(180deg) scale(0.7);
        }

        100% {
            transform: rotate(360deg) scale(1);
        }
    }

    /* 굶기 */
    body.hungry {
        background: #171717;
        color: white;
    }

    body.hungry h1,
    body.hungry .subtitle,
    body.hungry .hint {
        color: white;
    }

    body.hungry .card {
        animation: shake 0.5s infinite;
    }

    /* 파티클 */
    .particle {
        position: fixed;
        top: -30px;
        font-size: 25px;
        pointer-events: none;
        animation: fall 2.5s linear forwards;
        z-index: 100;
    }

    @keyframes fall {
        from {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }

        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

</style>
</head>

<body>

<h1>🍽️ 오늘 저녁 뭐 먹지?</h1>

<p class="subtitle">운명에 맡겨보세요...</p>

<div class="card" id="card" onclick="drawMenu()">

    <div class="card-inner">

        <!-- 카드 앞면 -->
        <div class="front">
            <div class="big">🎴</div>
            오늘의<br>저녁 메뉴
        </div>

        <!-- 카드 뒷면 -->
        <div class="back">

            <div class="emoji" id="emoji">🍚</div>

            <div class="menu" id="menu">
                메뉴
            </div>

            <div class="comment" id="comment">
                오늘은 이거다!
            </div>

        </div>

    </div>

</div>

<p class="hint">
    👆 카드를 눌러 운명을 확인하세요
</p>

<p class="hint">
    다시 누르면 새로운 메뉴를 뽑습니다
</p>


<script>

const menus = [

    {
        name: "치킨",
        emoji: "🍗",
        comment: "오늘은 치킨이다. 반박은 받지 않습니다.",
        type: "party"
    },

    {
        name: "피자",
        emoji: "🍕",
        comment: "콜라까지 시키면 완벽합니다.",
        type: "party"
    },

    {
        name: "삼겹살",
        emoji: "🥓",
        comment: "오늘은 고기 먹는 날!",
        type: "party"
    },

    {
        name: "떡볶이",
        emoji: "🌶️",
        comment: "맵지만 맛있으면 됐죠.",
        type: "normal"
    },

    {
        name: "초밥",
        emoji: "🍣",
        comment: "오늘은 고급스럽게 가봅니다.",
        type: "party"
    },

    {
        name: "햄버거",
        emoji: "🍔",
        comment: "감자튀김도 잊지 마세요.",
        type: "party"
    },

    {
        name: "라면",
        emoji: "🍜",
        comment: "귀찮을 땐 역시 라면.",
        type: "normal"
    },

    {
        name: "김치찌개",
        emoji: "🍲",
        comment: "밥 두 공기 각입니다.",
        type: "normal"
    },

    {
        name: "돈까스",
        emoji: "🥩",
        comment: "바삭함이 필요한 날.",
        type: "party"
    },

    {
        name: "냉면",
        emoji: "🍜",
        comment: "시원하게 한 그릇 갑시다.",
        type: "normal"
    },

    {
        name: "족발",
        emoji: "🍖",
        comment: "오늘은 야식까지 책임집니다.",
        type: "party"
    },

    {
        name: "국밥",
        emoji: "🍲",
        comment: "역시 든든한 국밥.",
        type: "normal"
    },

    {
        name: "파스타",
        emoji: "🍝",
        comment: "오늘은 분위기 있게!",
        type: "party"
    },

    {
        name: "닭발",
        emoji: "🌶️",
        comment: "매운맛으로 스트레스 날려버리기!",
        type: "normal"
    },

    {
        name: "김밥",
        emoji: "🍙",
        comment: "간단하지만 맛있습니다.",
        type: "normal"
    },

    /* 특별 메뉴 */

    {
        name: "다시 뽑기",
        emoji: "🔄",
        comment: "마음에 안 들죠? 한 번 더 뽑아봅시다.",
        type: "retry"
    },

    {
        name: "굶기",
        emoji: "💀",
        comment: "오늘은... 그냥 굶습니다.",
        type: "hungry"
    }

];


let isOpen = false;
let busy = false;


function drawMenu() {

    if (busy) return;

    const card = document.getElementById("card");
    const body = document.body;

    /* 굶기 효과 초기화 */
    body.classList.remove("hungry");

    /* 처음 뽑기 */
    if (!isOpen) {

        busy = true;

        /* 두근두근 */
        card.classList.add("heartbeat");

        setTimeout(() => {

            card.classList.remove("heartbeat");

            showRandomMenu();

            card.classList.add("open");

            isOpen = true;
            busy = false;

        }, 900);

    }

    /* 이미 열린 상태 */
    else {

        busy = true;

        /* 카드 닫기 */
        card.classList.remove("open");

        setTimeout(() => {

            showRandomMenu();

            card.classList.add("open");

            isOpen = true;
            busy = false;

        }, 500);

    }

}


function showRandomMenu() {

    const randomIndex =
        Math.floor(Math.random() * menus.length);

    const selected = menus[randomIndex];

    document.getElementById("emoji").innerText =
        selected.emoji;

    document.getElementById("menu").innerText =
        selected.name;

    document.getElementById("comment").innerText =
        selected.comment;


    /* 특별 효과 */

    if (selected.type === "party") {

        partyEffect();

    }

    if (selected.type === "hungry") {

        hungryEffect();

    }

    if (selected.type === "retry") {

        retryEffect();

    }

}


/* 🎉 당첨 효과 */

function partyEffect() {

    const emojis = [
        "🎉",
        "✨",
        "🎊",
        "🍗",
        "🍕",
        "❤️"
    ];

    for (let i = 0; i < 35; i++) {

        const particle =
            document.createElement("div");

        particle.className = "particle";

        particle.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];

        particle.style.left =
            Math.random() * 100 + "vw";

        particle.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 4000);
    }

}


/* 💀 굶기 효과 */

function hungryEffect() {

    document.body.classList.add("hungry");

    const card =
        document.getElementById("card");

    card.classList.add("shake");

    setTimeout(() => {

        card.classList.remove("shake");

    }, 600);

}


/* 🔄 다시 뽑기 효과 */

function retryEffect() {

    const card =
        document.getElementById("card");

    card.classList.add("spin");

    setTimeout(() => {

        card.classList.remove("spin");

    }, 800);

}

</script>

</body>
</html>
